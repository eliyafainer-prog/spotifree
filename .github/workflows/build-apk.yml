name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Spotifree Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd client
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x client/android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd client/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Distribution
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk Spotifree.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotifree-APK
          path: Spotifree.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: android-latest
          name: "Spotifree Android App"
          body: |
            ## Spotifree Android APK 🎵
            הורד את קובץ ה-APK והתקן אותו במכשיר האנדרואיד שלך לחוויית האזנה מלאה כולל ניגון ברקע ובמסך נעול!
            
            - **קובץ להורדה:** `Spotifree.apk`
            - **גרסה:** Latest Build
          files: Spotifree.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
